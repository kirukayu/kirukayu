<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!--
    Avatar: L.

    Drawn rather than set in a typeface, so the weight and the proportions are
    exact at every size. The stem is offset left of centre and the foot runs
    long — a centred L reads as a mistake, an intentionally placed one reads as
    a mark. GitHub crops this to a circle, so nothing sits within 90px of the
    edge and it still holds at 40 pixels.
  -->
  <defs>
    <radialGradient id="bg" cx="0.34" cy="0.24" r="0.94">
      <stop offset="0%"   stop-color="#1c1c1c"/>
      <stop offset="44%"  stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#040404"/>
    </radialGradient>

    <radialGradient id="haze" cx="0.74" cy="0.8" r="0.62">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.075"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="silver" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="44%"  stop-color="#e4e4e4"/>
      <stop offset="100%" stop-color="#9a9a9a"/>
    </linearGradient>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="discrete" tableValues="1"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#haze)"/>
  <rect width="1000" height="1000" filter="url(#grain)" opacity="0.05"/>

  <!--
    The letter: one path, square corner, flat terminals. Lifted above the
    geometric middle, because an L carries its mass in the bottom left and a
    mathematically centred one sits visibly low.
  -->
  <path d="M352 250 H448 V626 H700 V714 H352 Z" fill="url(#silver)"/>

  <!-- A hairline under the foot, so the mark has a base rather than an end. -->
  <rect x="352" y="766" width="348" height="6" fill="#ffffff" opacity="0.22"/>
</svg>
