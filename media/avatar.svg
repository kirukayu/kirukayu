<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!--
    Avatar.

    A single glyph over fog: two nested arcs broken at the cardinals, with a
    diamond at the centre. Round-cropped by GitHub, so nothing important sits
    within 70px of the edge, and it still reads at 40 pixels in a comment thread.
  -->
  <defs>
    <radialGradient id="bg" cx="0.34" cy="0.26" r="0.92">
      <stop offset="0%"   stop-color="#1a1a1a"/>
      <stop offset="46%"  stop-color="#0e0e0e"/>
      <stop offset="100%" stop-color="#040404"/>
    </radialGradient>

    <radialGradient id="haze" cx="0.7" cy="0.78" r="0.6">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="silver" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="48%"  stop-color="#dcdcdc"/>
      <stop offset="100%" stop-color="#7e7e7e"/>
    </linearGradient>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="discrete" tableValues="1"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#haze)"/>
  <rect width="1000" height="1000" filter="url(#grain)" opacity="0.045"/>

  <g fill="none" stroke="url(#silver)" stroke-linecap="round">
    <!-- Outer ring, broken at the four cardinals. -->
    <g stroke-width="26">
      <path d="M500 172 A328 328 0 0 1 828 500"/>
      <path d="M828 500 A328 328 0 0 1 500 828"/>
      <path d="M500 828 A328 328 0 0 1 172 500"/>
      <path d="M172 500 A328 328 0 0 1 500 172"/>
    </g>
    <!-- Inner ring, offset so the gaps never line up. -->
    <g stroke-width="12" stroke-opacity="0.5">
      <path d="M732 268 A328 328 0 0 1 732 732" transform="scale(0.7) translate(214 214)"/>
      <path d="M268 732 A328 328 0 0 1 268 268" transform="scale(0.7) translate(214 214)"/>
    </g>
  </g>

  <path d="M500 392 L608 500 L500 608 L392 500 Z" fill="url(#silver)"/>
</svg>
