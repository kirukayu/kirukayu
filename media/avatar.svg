<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!--
    D: the slice.

    One heavy bar through the frame with the fog torn open behind it. No letter,
    no diagram, no symbol to decode. It is the most reduced of the four and the
    one that survives smallest.
  -->
  <defs>
    <radialGradient id="bg" cx="0.3" cy="0.22" r="0.95">
      <stop offset="0%"   stop-color="#1f1f1f"/>
      <stop offset="42%"  stop-color="#101010"/>
      <stop offset="100%" stop-color="#030303"/>
    </radialGradient>

    <linearGradient id="tear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="42%"  stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ink" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#9c9c9c"/>
      <stop offset="46%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4c4c4"/>
    </linearGradient>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="discrete" tableValues="1"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#tear)"/>
  <rect width="1000" height="1000" filter="url(#grain)" opacity="0.05"/>

  <!--
    Two thin companions and one heavy stroke, all on the same rake.

    Every end stays inside the inscribed circle: GitHub crops avatars round, and
    a thin line sheared off mid-length by the rim reads as a mistake. Furthest
    corner of the heavy bar sits at r=353 of 500, the companions at r=300.
  -->
  <g transform="rotate(-32 500 500)">
    <rect x="302" y="286" width="15"  height="428" rx="8"  fill="#ffffff" opacity="0.26"/>
    <rect x="452" y="150" width="96"  height="700" rx="48" fill="url(#ink)"/>
    <rect x="683" y="286" width="15"  height="428" rx="8"  fill="#ffffff" opacity="0.26"/>
  </g>
</svg>
